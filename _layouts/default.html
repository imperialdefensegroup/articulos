<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }}</title>

  <!-- SEO básico -->
  {% if page.description %}
  <meta name="description" content="{{ page.description }}">
  {% endif %}

  <!-- Canonical -->
  {% if page.canonical %}
  <link rel="canonical" href="{{ page.canonical }}">
  {% endif %}


  {% if page.interviewee %}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ page.title | escape }}">
  <meta property="og:description" content="{{ page.description | escape }}">
  <meta property="og:url" content="{{ page.canonical | escape }}">
  <meta property="og:image" content="{{ page.image | absolute_url }}">
  <meta property="og:locale" content="es_ES">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "@id": "https://imperialdefensegroup.github.io/articulos/entrevista-luis-casanas-parte-2/#article",
  "url": "https://imperialdefensegroup.github.io/articulos/entrevista-luis-casanas-parte-2/",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://imperialdefensegroup.github.io/articulos/entrevista-luis-casanas-parte-2/"
  },
  "headline": "Luis Casañas de Castro: entrevista — Parte 2",
  "description": "Segunda parte de la entrevista a Luis Casañas de Castro sobre la Echelon 4.0, CZ P10C, CZ Bren 3 y el equipamiento de Policía Nacional y Guardia Civil.",
  "inLanguage": "es",
  "datePublished": "2026-04-25",
  "dateModified": "2026-09-08",
  "image": [
    "https://imperialdefensegroup.github.io/articulos/assets/img/cz-p10c-upgrades.jpg"
  ],
  "author": {
    "@type": "Organization",
    "name": "Imperial Defense Group",
    "url": "https://imperialdefensegroup.github.io/home/"
  },
  "publisher": {
    "@type": "Organization",
    "name": "Imperial Defense Group",
    "url": "https://imperialdefensegroup.github.io/home/"
  },
  "about": {
    "@type": "Person",
    "name": "Luis Casañas de Castro",
    "url": "https://imperialdefensegroup.github.io/articulos/2025/09/04/luis-casanas-de-castro-consultor-tactico/"
  }
}
  </script>
  {% endif %}

  <!-- Estilos -->
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Arial, sans-serif;
      line-height: 1.6;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 16px;
      font-size: 17px;
    }

    header, footer {
      opacity: 0.95;
    }

    header .site-title {
      margin: 0 0 5px 0;
      font-size: 28px;
      line-height: 1.2;
    }

    header a {
      text-decoration: none;
      color: inherit;
    }

    main {
      margin-top: 20px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.2;
    }

    h2 {
      font-size: 22px;
      margin-top: 30px;
    }

    p {
      margin: 12px 0;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      margin: 20px 0;
    }

    th, td {
      padding: 8px;
      border: 1px solid #ddd;
      text-align: left;
    }

    a {
      word-break: break-word;
    }

    pre, code {
      white-space: pre-wrap;
      word-break: break-word;
    }

    hr {
      margin: 30px 0;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 14px;
    }

    /* RESPONSIVE */
    @media (max-width: 600px) {
      body {
        margin: 20px auto;
        padding: 0 14px;
        font-size: 16px;
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <p class="site-title">
    <a href="https://imperialdefensegroup.github.io/home/">
      Imperial Defense Group
    </a>
  </p>
  {% if site.description %}
  <p>{{ site.description }}</p>
  {% endif %}
  <hr>
</header>

<main>
  {{ content }}
</main>

<hr>

<footer>
  <p>© {{ "now" | date: "%Y" }} Imperial Defense Group</p>

  <!-- BOTÓN ROJO CENTRADO -->
  <p style="margin-top: 12px;">
    <a href="https://imperialdefensegroup.github.io/home/"
       style="display: inline-block; background-color: #c1121f; color: #fff; padding: 12px 22px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 15px;">
      Inicio
    </a>
  </p>
</footer>

</body>
</html>
